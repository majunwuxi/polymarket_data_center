<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NBA 比赛日历</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{color-scheme:light;--bg:#f5f7fa;--panel:#fff;--border:#dce4ed;--muted:#61738a;--lime:#176a9b;--text:#182c43}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans','Microsoft YaHei',sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--lime);outline-offset:3px}.shell{max-width:1500px;margin:auto;padding:0 46px 40px}.top{height:82px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center;font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;letter-spacing:-.03em}.mark{background:var(--lime);color:#fff;border-radius:8px;width:30px;height:30px;display:grid;place-items:center;font-size:18px}.topright{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.dot{width:7px;height:7px;border-radius:50%;background:var(--lime)}.hero{padding:42px 0 34px;display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{color:var(--lime);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-family:'Space Grotesk','Microsoft YaHei',sans-serif;font-size:clamp(34px,4vw,53px);letter-spacing:-.045em;line-height:1.1;margin:12px 0}.hero p{color:var(--muted);font-size:14px;margin:0}.meta{color:var(--muted);font-size:12px;text-align:right;line-height:1.8}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(310px,.9fr);gap:18px;align-items:start}.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden}.panelhead{padding:24px 25px;display:flex;align-items:center;justify-content:space-between;gap:12px}.month{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.03em}.sub{color:var(--muted);font-size:12px;margin-top:5px}.nav{display:flex;gap:7px}.nav button{border:1px solid #cedbe6;background:#f1f5f9;border-radius:8px;height:36px;min-width:36px}.nav button:hover{background:#e2edf5}.nav .today{padding:0 12px;font-size:12px}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week{border-top:1px solid var(--border);color:var(--muted);font-size:11px;text-align:center;padding:13px 0}.grid{border-top:1px solid var(--border);border-left:1px solid var(--border)}.day{min-height:97px;text-align:left;border:0;border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:transparent;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}.day:hover{background:#eef4f8}.day.out{color:#a4afbd}.day.selected{background:#e5f1fb;box-shadow:inset 0 0 0 1px var(--lime)}.daynum{font-size:13px;font-weight:700}.day.today .daynum{color:var(--lime)}.count{font-size:11px;background:#e4f1fa;color:#17638e;border-radius:5px;padding:4px 6px}.details .panelhead{border-bottom:1px solid var(--border)}.detailtitle{font-size:19px;font-weight:700}.list{padding:7px 22px 18px;min-height:280px}.game{padding:20px 0;border-bottom:1px solid var(--border)}.game:last-child{border:0}.gametop{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted)}.status{font-size:11px;color:#087967}.teams{display:flex;align-items:center;gap:10px;margin:14px 0;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700}.team{background:#f5f8fb;border:1px solid #dce4ed;border-radius:8px;padding:8px 10px}.teams{flex-wrap:wrap}.team{display:flex;flex-direction:column;gap:3px;min-width:0;text-decoration:none;color:inherit}.team small{font:400 11px DM Sans,Microsoft YaHei,sans-serif;color:#61738a}.team[href]:hover{border-color:#176a9b;color:#176a9b}.versus{font-size:11px;color:#61738a}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;color:#526981;border:1px solid #dce4ed;border-radius:6px;padding:5px 7px}.detail-link{display:inline-block;margin-top:14px;color:#176a9b;font-size:12px;text-decoration:none}.detail-link:hover{text-decoration:underline}.issue{color:#9e5720;font-size:12px;margin-top:12px;line-height:1.5}.empty{color:var(--muted);padding:50px 0;text-align:center;font-size:13px;line-height:1.8}.foot{padding:18px 25px;border-top:1px solid var(--border);color:var(--muted);font-size:12px;line-height:1.6}.notice{color:#795b22;padding:12px 16px;border:1px solid #e8d7af;border-radius:10px;background:#fff8e9;margin-bottom:18px;font-size:13px;line-height:1.6}.hidden{display:none}.legend{display:flex;gap:16px;color:var(--muted);font-size:11px;padding-top:18px}.legend b{color:var(--lime)}@media(max-width:950px){.layout{grid-template-columns:1fr}.day{min-height:75px}.meta{display:none}}@media(max-width:600px){.shell{padding:0 16px 28px}.top{height:66px}.topright{font-size:11px}.hero{padding:32px 0 24px}.day{min-height:57px;padding:7px;gap:5px}.count{font-size:9px;padding:3px}.panelhead{padding:18px}.month{font-size:18px}.list{padding:5px 18px}.week{font-size:10px}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><span class="mark">↗</span> COURTSIDE <span style="color:#7f8c83;font-weight:400">/ NBA</span></div><div class="topright"><span class="dot"></span> 本地赛程观察</div></header>
<section class="hero"><div><div class="eyebrow">NBA MARKET TRACKER &nbsp; / &nbsp; 赛程日历</div><h1>每一场比赛，<br>都在日历里。</h1><p>按日期查看比赛与胜负、让分、总分的记录情况。</p></div><div class="meta">北京时间 · Asia/Shanghai<br>数据来自本地采集数据库</div></section>
<div id="notice" class="notice hidden" role="status"></div><main class="layout"><section class="panel" aria-label="比赛月历"><div class="panelhead"><div><div class="month" id="month"></div><div class="sub">选择日期，查看当天比赛</div></div><div class="nav"><button id="prev" aria-label="上个月">‹</button><button id="today" class="today">今天</button><button id="next" aria-label="下个月">›</button></div></div><div class="week"><span>周日</span><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span></div><div id="grid" class="grid"></div></section>
<aside class="panel details"><div class="panelhead"><div><div class="eyebrow">GAME DAY</div><div class="detailtitle" id="selected"></div></div><span class="sub" id="total"></span></div><div id="list" class="list"></div><div class="foot">胜负 · 让分 · 总分<br>市场开放不代表交易已完整采集。交易统计功能仍在开发中。</div></aside></main><div class="legend"><span><b>●</b> 北京时间</span><span>○ 日期内显示比赛场数</span></div></div>
<script>
const $=id=>document.getElementById(id);const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'});const today=()=>fmt.format(new Date());let selected=today(),month=selected.slice(0,7),games=[];
function team(name,url){let e=el(url?'a':'span','team');if(url){e.href=url;e.target='_blank';e.rel='noopener noreferrer';e.title='打开 Polymarket 比赛页面'}e.append(el('span','',name.zh),el('small','',name.en));return e}function el(tag,cls,text){let e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}function dateLabel(s){let [y,m,d]=s.split('-');return `${Number(m)}月${Number(d)}日`}function paint(){let [y,m]=month.split('-').map(Number);$('month').textContent=`${y}年 ${m}月`;$('selected').textContent=dateLabel(selected)+' 的比赛';let current=games.filter(g=>g.date===selected);$('total').textContent=`${current.length} 场`;let grid=$('grid');grid.replaceChildren();let first=new Date(Date.UTC(y,m-1,1)),start=new Date(Date.UTC(y,m-1,1-first.getUTCDay()));for(let i=0;i<42;i++){let d=new Date(start.getTime()+i*86400000),key=d.toISOString().slice(0,10),n=games.filter(g=>g.date===key).length,b=el('button','day'+(key.slice(0,7)!==month?' out':'')+(key===selected?' selected':'')+(key===today()?' today':''));b.setAttribute('aria-label',`${key}，${n}场比赛`);b.setAttribute('aria-pressed',key===selected?'true':'false');b.append(el('span','daynum',String(d.getUTCDate())));if(n)b.append(el('span','count',`${n} 场比赛`));b.onclick=()=>{selected=key;month=key.slice(0,7);paint()};grid.append(b)}let list=$('list');list.replaceChildren();if(!current.length){list.append(el('div','empty','这一天暂无已保存的比赛。\n赛程由采集程序定期更新。'));return}for(let g of current){let card=el('article','game'),top=el('div','gametop'),status=g.error?'检查失败':g.status==='open'?'市场已开放':'尚未确认开放';top.append(el('span','',`${g.time} · 北京时间`),el('span','status',status));let teams=el('div','teams');teams.append(team(g.away,g.url),el('span','versus','客  /  主'),team(g.home,g.url));let chips=el('div','chips');for(let [k,label] of [['moneyline','胜负'],['spreads','让分'],['totals','总分']])chips.append(el('span','chip',`${label} 已记录 ${g.market_counts[k]} 个盘口`));card.append(top,teams,chips);let detail=el('a','detail-link','查看比赛详情 →');detail.href='/game?slug='+encodeURIComponent(g.slug);card.append(detail);if(g.status!=='open'&&g.url)card.append(el('div','sub','候选链接：市场可能尚未开放')); if(g.error||g.market_errors)card.append(el('div','issue',g.error||`${g.market_errors} 个盘口采集出错，请检查采集状态。`));list.append(card)}}
function shift(n){let [y,m]=month.split('-').map(Number),d=new Date(Date.UTC(y,m-1+n,1));month=d.toISOString().slice(0,7);selected=month+'-01';paint()}$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('today').onclick=()=>{selected=today();month=selected.slice(0,7);paint()};async function load(){try{let r=await fetch('/api/calendar',{cache:'no-store'});if(!r.ok)throw Error('服务返回错误');let data=await r.json();games=data.games;let notice=$('notice');notice.textContent=data.message||'';notice.classList.toggle('hidden',!data.message);paint()}catch(e){let notice=$('notice');notice.textContent='无法读取赛程，请检查本地服务是否正在运行。';notice.classList.remove('hidden')}}paint();load();setInterval(load,60000);
</script></body></html>
