<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>盘口汇总 · NBA 交易记录</title>
<style>
:root{color-scheme:dark;--bg:#101211;--panel:#191d1b;--line:#303733;--text:#f2f6ee;--muted:#98a49b;--accent:#d7fc72}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,'Microsoft YaHei',sans-serif}a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.wrap{max-width:1280px;margin:auto;padding:0 38px 60px}.top{height:76px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:.04em}.brand i{font-style:normal;color:var(--accent)}.back{font-size:13px;text-decoration:none;color:#b5c0b7}.hero{padding:42px 0 28px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:700}.hero h1{font-size:clamp(27px,4vw,44px);letter-spacing:-.04em;margin:14px 0 8px}.hero p{color:var(--muted);font-size:14px;line-height:1.7;margin:0}.external{display:inline-block;margin-top:16px;font-size:13px;color:var(--accent)}.banner{padding:15px 18px;border:1px solid #61573b;border-radius:12px;background:#29271d;color:#e5d5a5;font-size:13px;line-height:1.7;margin-bottom:22px}.titlebar{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:18px}.titlebar h2{margin:0;font-size:22px}.muted{color:var(--muted);font-size:12px;line-height:1.6}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tab{border:1px solid #39423a;background:#1c211d;border-radius:8px;padding:9px 13px;font-size:12px}.tab.active{background:#303c2a;border-color:#7c9c57;color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.cardhead{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:start;justify-content:space-between;gap:10px}.cardhead h3{font-size:16px;margin:7px 0 0;line-height:1.45}.tag{font-size:10px;color:var(--accent);letter-spacing:.08em}.marketmeta{padding:14px 22px;display:flex;gap:22px;flex-wrap:wrap;color:var(--muted);font-size:12px}.marketmeta b{color:var(--text);font-size:15px;margin-right:4px}.outcomes{padding:0 22px 17px}.outcome{border-top:1px solid var(--line);padding:15px 0;display:grid;grid-template-columns:minmax(90px,1fr) 1fr 1fr;gap:12px;align-items:center}.outcome-name{font-size:14px;font-weight:700;overflow-wrap:anywhere}.amount-label{font-size:11px;color:var(--muted);margin-bottom:5px}.amount{font-size:17px;font-weight:700;letter-spacing:-.02em}.buy{color:var(--accent)}.sub{font-size:11px;color:var(--muted);margin-top:3px}.empty{padding:40px 22px;color:var(--muted);text-align:center;line-height:1.7;font-size:13px}.card .empty{padding:10px 0 16px;text-align:left}.warning{color:#f3bb85;font-size:12px;padding:0 22px 16px}.foot{margin-top:20px;color:var(--muted);font-size:12px;line-height:1.8}.hidden{display:none}@media(max-width:800px){.wrap{padding:0 16px 35px}.top{height:64px}.hero{padding:30px 0}.grid{grid-template-columns:1fr}.titlebar{align-items:start;flex-direction:column}.outcome{grid-template-columns:minmax(75px,1fr) 1fr 1fr;gap:8px}.amount{font-size:15px}}
</style></head><body><div class="wrap"><header class="top"><span class="brand"><i>↗</i> COURTSIDE / NBA</span><a class="back" href="/">← 返回比赛日历</a></header><section class="hero"><div class="eyebrow">GAME SUMMARY &nbsp; / &nbsp; 比赛盘口汇总</div><h1 id="title">正在读取比赛…</h1><p id="subtitle">数据来自本地数据库 · 北京时间</p><a id="external" class="external hidden" target="_blank" rel="noopener noreferrer">在 Polymarket 查看比赛 ↗</a></section><div class="banner">以下是本地已记录的数据，可能有遗漏或重复。买入和卖出分别统计，不能直接相加当作网站总成交额，也不等于钱包当前持仓。金额按价格 × 份数估算，不含手续费。</div><div id="problem" class="banner hidden" role="alert"></div><main id="content"><div class="titlebar"><div><div class="eyebrow">MARKET OVERVIEW</div><h2>各盘口汇总</h2></div><div class="muted">按结果分别查看买入和卖出 · 每分钟更新</div></div><div class="tabs" id="tabs"></div><div id="markets" class="grid"></div></main><div class="foot">记录笔数是已保存的成交记录数量，钱包数按盘口去重，不等于人数。开赛超过 24 小时且市场全部结算后，明细可能按清理规则删除。</div></div>
<script>
const $=id=>document.getElementById(id),slug=new URLSearchParams(location.search).get('slug')||'';const labels={moneyline:'全场胜负',spreads:'全场让分',totals:'全场总分'};let kind='all',data=null;function el(tag,cls,value){let e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=value;return e}function money(v,count){if(!count)return '—';let n=Number(v);return Number.isFinite(n)?(n>0&&n<0.0001?'<$0.0001':'$'+n.toLocaleString('en-US',{maximumFractionDigits:4})):'无法显示'}function clock(ts){return ts==null?'尚未完成检查':'检查至 '+new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(ts*1000))}
function render(){let g=data.game;$('title').textContent=g.away.zh+' vs '+g.home.zh;$('subtitle').textContent=g.away.en+'  vs  '+g.home.en+'  ·  '+g.date+' '+g.time+'（北京时间） · '+(g.error?'市场查询失败':g.status==='open'?'市场已确认开放':'市场尚未确认开放');if(g.url){$('external').href=g.url;$('external').classList.remove('hidden');$('external').textContent=g.status==='open'?'在 Polymarket 查看比赛 ↗':'打开 Polymarket 候选地址（可能尚未开放） ↗'}let counts={all:data.markets.length,moneyline:0,spreads:0,totals:0};for(let m of data.markets)counts[m.type]++;let tabs=$('tabs');tabs.replaceChildren();for(let k of ['all','moneyline','spreads','totals']){let b=el('button','tab'+(kind===k?' active':''),(k==='all'?'全部盘口':labels[k])+' · '+counts[k]);b.setAttribute('aria-pressed',String(kind===k));b.onclick=()=>{kind=k;render()};tabs.append(b)}let grid=$('markets');grid.replaceChildren();let items=data.markets.filter(m=>kind==='all'||m.type===kind);if(!items.length){grid.append(el('div','empty','暂无已记录的盘口，采集到数据后会自动显示。'));return}for(let m of items){let card=el('article','card'),head=el('div','cardhead'),heading=el('div');heading.append(el('div','tag',labels[m.type]),el('h3','',m.question));head.append(heading,el('span','muted',m.line==null?'':'盘口 '+m.line));let meta=el('div','marketmeta');let rec=el('span'),wallet=el('span');rec.append(el('b','',String(m.records)),document.createTextNode('条记录'));wallet.append(el('b','',String(m.wallet_count)),document.createTextNode('个钱包'));meta.append(rec,wallet,el('span','',clock(m.checkpoint)));let outcomes=el('div','outcomes');if(!m.outcomes.length)outcomes.append(el('div','empty','暂无成交记录'));for(let o of m.outcomes){let row=el('div','outcome'),buy=el('div'),sell=el('div');buy.append(el('div','amount-label','买入金额'),el('div','amount buy',money(o.buy,o.buy_count)),el('div','sub',o.buy_count+' 条有效记录'));sell.append(el('div','amount-label','卖出金额'),el('div','amount',money(o.sell,o.sell_count)),el('div','sub',o.sell_count+' 条有效记录'));row.append(el('div','outcome-name',o.name),buy,sell);outcomes.append(row)}card.append(head,meta,outcomes);let errors=[];if(m.error)errors.push('采集出错：'+m.error);if(m.invalid)errors.push(m.invalid+' 条记录金额无法计算');if(m.unknown_side)errors.push(m.unknown_side+' 条记录买卖方向不明');if(errors.length)card.append(el('div','warning',errors.join('；')));grid.append(card)}}
async function load(){try{let r=await fetch('/api/summary/'+encodeURIComponent(slug),{cache:'no-store'});if(!r.ok)throw Error('服务无法响应');let d=await r.json();if(d.error)throw Error(d.error);data=d;$('problem').classList.add('hidden');$('content').classList.remove('hidden');render()}catch(e){$('problem').textContent=e.message||'读取失败，请检查本地服务。';$('problem').classList.remove('hidden');$('content').classList.add('hidden');$('title').textContent='暂无比赛数据'}}load();setInterval(load,60000);
</script></body></html>
